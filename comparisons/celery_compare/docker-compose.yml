# RabbitMQ for the Celery comparison. Pull the image once while you have wifi:
#   docker compose -f comparisons/celery_compare/docker-compose.yml pull
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # management UI: guest / guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
