<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stitch · live</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101410;
    --panel: #181d18;
    --panel-2: #1e2520;
    --line: #2c352e;
    --ink: #ebe6da;
    --muted: #8d9688;
    --done: #8fbf73;
    --run: #e4c15a;
    --fall: #e0924a;
    --bad: #e15d4f;
    --wait: #d7c4a3;
    --info: #8eb8c4;
    --shadow: 0 0 0 1px var(--line);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 ui-sans-serif, "Avenir Next", "Segoe UI", sans-serif;
  }
  button, select { font: inherit; color: inherit; }
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 22px 14px;
    border-bottom: 1px solid var(--line);
  }
  .mark { font-family: Georgia, "Iowan Old Style", serif; font-style: italic; font-size: 22px; }
  .sub { color: var(--muted); letter-spacing: 0.04em; }
  .status-pill {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  .dot.live { background: var(--done); box-shadow: 0 0 0 4px rgba(143, 191, 115, 0.15); }
  .dot.held { background: var(--fall); }
  .dot.dead { background: var(--bad); }
  main { padding: 16px 22px 28px; display: grid; gap: 14px; }
  .faults, .layout { display: grid; gap: 14px; }
  .layout { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    box-shadow: var(--shadow);
    padding: 12px 14px;
  }
  h2 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h2 span { letter-spacing: 0.04em; font-weight: 500; }
  .faults { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 980px) { .faults { grid-template-columns: 1fr 1fr; } }
  .fault {
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 12px 12px 11px;
    cursor: pointer;
  }
  .fault:hover { border-color: #465246; }
  .fault:disabled { opacity: 0.55; cursor: wait; }
  .fault strong { display: block; font-size: 14px; font-weight: 650; }
  .fault span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .fault.on { background: #2a2118; border-color: var(--fall); }
  .fault.on strong { color: var(--fall); }
  .banner {
    padding: 10px 12px;
    background: var(--panel-2);
    box-shadow: var(--shadow);
    color: var(--wait);
  }
  .banner.bad { color: #f0c2bc; }
  .stages { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .stage {
    flex: 1;
    min-width: 120px;
    padding: 8px 10px;
    background: var(--panel-2);
    box-shadow: var(--shadow);
  }
  .stage b { display: block; font-weight: 650; }
  .stage em { font-style: normal; color: var(--muted); font-size: 12px; }
  .stage.run { box-shadow: inset 2px 0 0 var(--run), var(--shadow); }
  .jobs { max-height: 62vh; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    position: sticky; top: 0;
    background: var(--panel);
    text-align: left;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 650;
    padding: 6px 8px;
  }
  td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
  tr.running td { background: rgba(228, 193, 90, 0.06); }
  tr.fallback td:first-child { box-shadow: inset 2px 0 0 var(--fall); }
  tr.failed td:first-child { box-shadow: inset 2px 0 0 var(--bad); }
  .id { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .what { color: var(--muted); }
  .cell {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 84px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
  }
  .swatch { width: 8px; height: 8px; border-radius: 1px; background: #3a433c; }
  .cell.done { color: var(--done); } .cell.done .swatch { background: var(--done); }
  .cell.running { color: var(--run); } .cell.running .swatch { background: var(--run); animation: blink 1s steps(2) infinite; }
  .cell.degraded { color: var(--fall); } .cell.degraded .swatch { background: var(--fall); }
  .cell.failed { color: var(--bad); } .cell.failed .swatch { background: var(--bad); }
  .cell.waiting { color: var(--wait); } .cell.waiting .swatch { background: var(--wait); }
  .cell.pending { color: #5c665e; }
  @keyframes blink { 50% { opacity: 0.35; } }
  .tag {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .tag.done { color: var(--done); }
  .tag.fallback { color: var(--fall); }
  .tag.failed, .tag.running { color: var(--bad); }
  .tag.running { color: var(--run); }
  .tag.parked, .tag.waiting { color: var(--wait); }
  .side { display: grid; gap: 14px; }
  ol.feed, ul.plain { list-style: none; margin: 0; padding: 0; }
  ol.feed { max-height: 280px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  ol.feed li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; font-size: 12px; }
  time { color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .feed .retry, .feed .degraded, .feed .failed { color: var(--fall); }
  .feed .failed { color: var(--bad); }
  .prov { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .prov:first-child { border-top: 0; }
  .state.ready { color: var(--done); }
  .state.cooling, .state.probe { color: var(--fall); }
  .state.disabled { color: var(--muted); }
  .pub { padding: 8px 0; border-top: 1px solid var(--line); }
  .pub:first-of-type { border-top: 0; }
  .pub .meta { color: var(--muted); font-size: 12px; }
  .src.llm { color: var(--done); }
  .src.fallback { color: var(--fall); }
  .empty { color: var(--muted); margin: 8px 0 2px; }
  .runpick { margin-left: 8px; background: var(--bg); border: 1px solid var(--line); padding: 2px 6px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink); }
</style>
</head>
<body>
<header>
  <div class="mark">stitch</div>
  <div class="sub" id="run-name">live board</div>
  <select id="runpick" class="runpick" hidden></select>
  <div class="status-pill"><span class="dot" id="dot"></span><span id="process">connecting…</span></div>
</header>
<main>
  <div id="banner"></div>
  <section class="faults" id="faults">
    <button class="fault" id="btn-pause" type="button">
      <strong>Pause network</strong>
      <span>The call in flight waits, then finishes when you resume.</span>
    </button>
    <button class="fault" id="btn-llm" type="button">
      <strong>Stop LLM calls</strong>
      <span>Intel and the dashboard stay up. New summaries use a fallback.</span>
    </button>
    <button class="fault" id="btn-credits" type="button">
      <strong>Drain credits</strong>
      <span>eu-west-1 runs out of tokens and the breaker opens.</span>
    </button>
    <button class="fault" id="btn-outage" type="button">
      <strong>Region outage</strong>
      <span>eu-west-1 answers 503, as if the region were down.</span>
    </button>
  </section>
  <div class="layout">
    <section class="panel">
      <h2>Jobs <span id="jobcount"></span></h2>
      <div class="stages" id="stages"></div>
      <div class="jobs" id="jobs"></div>
    </section>
    <div class="side">
      <section class="panel">
        <h2>Activity</h2>
        <ol class="feed" id="feed"></ol>
      </section>
      <section class="panel">
        <h2>LLM providers</h2>
        <div id="providers"></div>
      </section>
      <section class="panel">
        <h2>Published</h2>
        <div id="published"></div>
      </section>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let selected = null;
let inflight = false;
let feedTail = 0;

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}

function clock(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString([], { hour12: false });
}

function region(data, name) {
  return (data.llm && data.llm.regions && data.llm.regions[name]) || null;
}

async function tick() {
  try {
    const data = await (await fetch("/admin/board", { cache: "no-store" })).json();
    render(data);
  } catch (err) {
    $("process").textContent = "board unreachable";
    $("dot").className = "dot dead";
  }
}

function render(data) {
  const runs = data.runs || [];
  if (!selected || !runs.some((run) => run.id === selected)) {
    selected = (runs[runs.length - 1] || {}).id || null;
  }
  const run = runs.find((item) => item.id === selected) || null;
  renderPick(runs);
  renderProcess(data, run);
  renderFaults(data);
  renderJobs(data, run);
  renderFeed(data.activity || []);
  renderProviders(data);
  renderPublished(data.published || []);
}

function renderPick(runs) {
  const pick = $("runpick");
  pick.hidden = runs.length < 2;
  if (runs.length < 2) return;
  const html = runs.map((run) =>
    `<option value="${esc(run.id)}"${run.id === selected ? " selected" : ""}>${esc(run.id)}</option>`
  ).join("");
  if (pick.innerHTML !== html) pick.innerHTML = html;
}

function renderProcess(data, run) {
  const control = data.control || {};
  const items = run ? run.items : [];
  const running = items.some((item) => item.status === "running" ||
    Object.values(item.steps).some((step) => step.status === "running"));
  const quietFor = data.latest_event_at ? data.server_time - data.latest_event_at : Infinity;
  const dot = $("dot");
  let text = "waiting for a pipeline";
  let kind = "";
  let banner = "";
  if (control.paused && running) {
    text = "held · network paused";
    kind = "held";
    banner = "Network is paused. The step in flight is waiting on that call. Resume it and the same step finishes.";
  } else if (control.paused) {
    text = "network paused";
    kind = "held";
    banner = "Network is paused. The next vendor call will wait until you resume.";
  } else if (running && quietFor > 3) {
    text = "pipeline stopped mid-job";
    kind = "dead";
    banner = "Checkpoints are intact. Continue with <code>python -m demo resume</code>.";
  } else if (running) {
    text = "executing";
    kind = "live";
  } else if (run && items.length) {
    text = run.status === "done" ? "batch finished" : "idle";
    kind = run.status === "done" ? "live" : "";
  }
  if (control.chaos && control.chaos !== "calm") {
    banner = (banner ? banner + " " : "") + `Vendor chaos is ${esc(control.chaos)}, so some failures are random.`;
  }
  const degraded = items.filter((item) => item.degraded).length;
  if (degraded && !control.llm_stopped && !(region(data, "eu-west-1") || {}).outage) {
    banner = (banner ? banner + " " : "") +
      `${degraded} job${degraded === 1 ? "" : "s"} used a fallback. With the LLM back, <code>python -m demo heal</code> replaces them.`;
  }
  dot.className = "dot" + (kind ? " " + kind : "");
  $("process").textContent = text;
  $("run-name").textContent = run ? run.id : "live board";
  $("banner").innerHTML = banner ? `<div class="banner${kind === "dead" ? " bad" : ""}">${banner}</div>` : "";
}

function renderFaults(data) {
  const control = data.control || {};
  const eu = region(data, "eu-west-1");
  const credits = eu ? eu.credits : null;
  const drained = credits !== null && credits <= 0;
  const outage = !!(eu && eu.outage);
  setFault($("btn-pause"), control.paused, control.paused ? "Resume network" : "Pause network",
    control.paused ? "Calls are waiting. Resume to let them finish." : "The call in flight waits, then finishes when you resume.");
  setFault($("btn-llm"), control.llm_stopped, control.llm_stopped ? "Allow LLM calls" : "Stop LLM calls",
    control.llm_stopped ? "LLM calls are refused. Allow them, then heal fallbacks." : "Intel and the dashboard stay up. New summaries use a fallback.");
  setFault($("btn-credits"), drained, drained ? "Refill credits" : "Drain credits",
    drained ? "eu-west-1 has no tokens. Refill to let the probe succeed." : "eu-west-1 runs out of tokens and the breaker opens.");
  setFault($("btn-outage"), outage, outage ? "End region outage" : "Region outage",
    outage ? "eu-west-1 is down. End the outage to let calls through." : "eu-west-1 answers 503, as if the region were down.");
  $("btn-credits").disabled = inflight || !eu;
  $("btn-outage").disabled = inflight || !eu;
}

function setFault(button, on, title, detail) {
  button.classList.toggle("on", on);
  button.setAttribute("aria-pressed", on ? "true" : "false");
  button.disabled = inflight;
  button.querySelector("strong").textContent = title;
  button.querySelector("span").textContent = detail;
}

function renderJobs(data, run) {
  const stages = $("stages");
  const jobs = $("jobs");
  if (!run || !run.items.length) {
    stages.innerHTML = "";
    $("jobcount").textContent = "";
    jobs.innerHTML = `<p class="empty">No jobs yet. In another terminal: <code>python -m demo live</code></p>`;
    return;
  }
  const columns = run.columns || [];
  stages.innerHTML = columns.map((column) => {
    const counts = countStep(run.items, column.id);
    const hot = counts.running ? " run" : "";
    return `<div class="stage${hot}"><b>${esc(column.label)}</b><em>${esc(stageLine(counts))}</em></div>`;
  }).join("");
  const seen = run.items.length;
  $("jobcount").textContent = run.expected ? `${seen} of ${run.expected} started` : `${seen} started`;
  const head = `<tr><th>Job</th><th>Work</th>${
    columns.map((column) => `<th>${esc(column.label)}</th>`).join("")
  }<th></th></tr>`;
  const body = run.items.map((item) => {
    const cells = columns.map((column) => stepCell(item.steps[column.id], column.label, data)).join("");
    const cls = [
      item.status === "running" ? "running" : "",
      item.degraded ? "fallback" : "",
      item.status === "failed" ? "failed" : "",
    ].filter(Boolean).join(" ");
    return `<tr class="${cls}"><td class="id">${esc(item.id)}</td><td class="what">${esc(item.label)}</td>${cells}<td class="tag ${esc(jobKind(item))}">${esc(jobText(item))}</td></tr>`;
  }).join("");
  const top = jobs.scrollTop;
  jobs.innerHTML = `<table>${head}${body}</table>`;
  jobs.scrollTop = top;
}

function countStep(items, id) {
  const counts = { running: 0, done: 0, degraded: 0, failed: 0, waiting: 0 };
  for (const item of items) {
    const step = item.steps[id];
    if (step && counts[step.status] !== undefined) counts[step.status] += 1;
  }
  return counts;
}

function stageLine(counts) {
  const parts = [];
  if (counts.running) parts.push(`${counts.running} running`);
  if (counts.done) parts.push(`${counts.done} done`);
  if (counts.degraded) parts.push(`${counts.degraded} fallback`);
  if (counts.waiting) parts.push(`${counts.waiting} waiting`);
  if (counts.failed) parts.push(`${counts.failed} failed`);
  return parts.join(" · ") || "not started";
}

function stepCell(step, label, data) {
  if (!step) return `<td><span class="cell pending"><i class="swatch"></i>${esc(label)}</span></td>`;
  let note = "";
  if (step.status === "running" && data.server_time && step.started_at) {
    note = ` ${Math.max(0, data.server_time - step.started_at).toFixed(0)}s`;
  } else if (step.attempts > 1) {
    note = ` ×${step.attempts}`;
  }
  const title = step.error ? ` title="${esc(step.error)}"` : "";
  return `<td><span class="cell ${esc(step.status)}"${title}><i class="swatch"></i>${esc(label)}${esc(note)}</span></td>`;
}

function jobKind(item) {
  if (item.status === "failed") return "failed";
  if (item.status === "parked") return "parked";
  if (item.status === "running") return "running";
  if (item.degraded) return "fallback";
  if (item.status === "done") return "done";
  return "";
}

function jobText(item) {
  if (item.status === "parked") return "parked";
  if (item.status === "failed") return "failed";
  if (item.status === "running") return "running";
  if (item.degraded) return "fallback";
  if (item.status === "done") return "done";
  return item.status;
}

function renderFeed(events) {
  const feed = $("feed");
  const last = events.length ? events[events.length - 1].id : 0;
  if (last === feedTail && feed.childElementCount) return;
  feedTail = last;
  const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  feed.innerHTML = events.map((event) => {
    const cls = /retry|degraded|waiting|failed|breaker_opened|provider_failed/.test(event.event) ? event.event : "";
    return `<li class="${esc(cls)}"><time>${esc(clock(event.ts))}</time><span>${esc(line(event))}</span></li>`;
  }).join("") || `<li><time></time><span class="empty">Nothing recorded yet.</span></li>`;
  if (nearBottom) feed.scrollTop = feed.scrollHeight;
}

function line(event) {
  const who = [event.item, event.step].filter(Boolean).join(" · ");
  const detail = event.detail || {};
  const name = event.provider || detail.provider || "";
  switch (event.event) {
    case "step_started": return `${who} started${detail.interrupted ? " again" : ""}`;
    case "step_done": return `${who} finished${detail.degraded ? " with a fallback" : ""}`;
    case "step_skipped": return `${who} skipped, checkpoint found`;
    case "step_retry": return `${who} retry ${event.attempt}: ${detail.error || "transient failure"}`;
    case "step_degraded": return `${who} fallback · ${detail.reason || "provider unavailable"}`;
    case "step_failed": return `${who} failed · ${detail.error || ""}`;
    case "step_waiting": return `${who} waiting · ${detail.reason || ""}`;
    case "item_done": return `${event.item} done${detail.degraded ? " (fallback published)" : ""}`;
    case "item_failed": return `${event.item} failed · ${detail.error || ""}`;
    case "item_parked": return `${event.item} parked · ${detail.reason || ""}`;
    case "item_started": return `${event.item} started${detail.resumed ? " from checkpoint" : ""}`;
    case "breaker_opened": return `breaker open on ${name} · ${detail.reason || ""}`;
    case "breaker_closed": return `${name} healthy again`;
    case "breaker_probe": return `probing ${name}`;
    case "provider_failed": return `${name} refused · ${detail.error || detail.kind || ""}`;
    case "failover": return `failed over to ${name}`;
    case "provider_used": return `using ${name}`;
    case "crash": return `killed during ${who}`;
    default: return who ? `${event.event} · ${who}` : event.event;
  }
}

function renderProviders(data) {
  const host = $("providers");
  const eu = region(data, "eu-west-1");
  const rows = data.providers || [];
  if (!rows.length && !eu) {
    host.innerHTML = `<p class="empty">The pool appears when the pipeline makes its first LLM call.</p>`;
    return;
  }
  const meters = Object.entries((data.llm && data.llm.regions) || {}).map(([name, info]) => {
    const credits = name === "local-small" ? "unmetered" : Math.max(info.credits, 0).toLocaleString();
    const flag = info.outage ? "outage" : (info.credits <= 0 && name !== "local-small" ? "no credits" : "accepting");
    return `<div class="prov"><span class="id">${esc(name)}</span><span>${esc(credits)} · ${esc(flag)}</span></div>`;
  }).join("");
  const breakers = rows.map((row) => {
    const extra = row.state === "cooling" ? ` · ${row.retry_in.toFixed(0)}s` : "";
    const why = row.reason ? ` · ${row.reason}` : "";
    return `<div class="prov"><span class="id">${esc(row.name)}</span><span class="state ${esc(row.state)}">${esc(row.state)}${esc(extra)}${esc(why)}</span></div>`;
  }).join("");
  host.innerHTML = meters + breakers;
}

function renderPublished(events) {
  const host = $("published");
  if (!events.length) {
    host.innerHTML = `<p class="empty">Nothing on the analyst dashboard yet.</p>`;
    return;
  }
  const shown = events.slice(-8);
  host.innerHTML = shown.map((event) => {
    const fallback = event.source !== "llm";
    const src = fallback ? "fallback" : "llm";
    return `<div class="pub"><div class="id">${esc(event.id)} <span class="src ${src}">${esc(event.source || "")}</span> <span class="meta">v${esc(event.version)} · ${esc(event.severity || "")}</span></div><div class="what">${esc(event.summary || "")}</div></div>`;
  }).join("") + (events.length > shown.length ? `<p class="empty">${events.length - shown.length} earlier events not shown.</p>` : "");
}

async function post(url, body) {
  if (inflight) return;
  inflight = true;
  try {
    await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    await tick();
  } finally {
    inflight = false;
    await tick();
  }
}

$("btn-pause").onclick = () => {
  const on = $("btn-pause").getAttribute("aria-pressed") === "true";
  post("/admin/control", { paused: !on });
};
$("btn-llm").onclick = () => {
  const on = $("btn-llm").getAttribute("aria-pressed") === "true";
  post("/admin/control", { llm_stopped: !on });
};
$("btn-credits").onclick = () => {
  const refill = $("btn-credits").getAttribute("aria-pressed") === "true";
  post("/admin/llm", { region: "eu-west-1", credits: refill ? 4000 : 0 });
};
$("btn-outage").onclick = () => {
  const on = $("btn-outage").getAttribute("aria-pressed") === "true";
  post("/admin/llm", { region: "eu-west-1", outage: !on });
};
