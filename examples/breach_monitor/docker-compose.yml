# MongoDB and RabbitMQ for the breach monitor (images are the same ones the comparisons use).
services:
  mongo:
    image: mongo:7.0
    ports: ["27017:27017"]
    volumes: ["breach-mongo:/data/db"]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]     # management UI: guest / guest
volumes:
  breach-mongo:
